<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personalización 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="layout">

    <!-- Visor 3D -->
    <section class="visor">
      <canvas id="canvas3d"></canvas>
      <div id="texto-preview" class="texto-preview"></div>
    </section>

    <!-- Panel de controles -->
    <aside class="panel">
      <h1>Personaliza tu pieza</h1>

      <!-- COLOR -->
      <div class="campo">
        <label>Color del bloque</label>
        <div class="colores-predefinidos">
          <button class="color-btn" data-color="#e74c3c" style="background:#e74c3c" title="Rojo"></button>
          <button class="color-btn" data-color="#3498db" style="background:#3498db" title="Azul"></button>
          <button class="color-btn" data-color="#2ecc71" style="background:#2ecc71" title="Verde"></button>
          <button class="color-btn" data-color="#1a1a1a" style="background:#1a1a1a" title="Negro"></button>
          <button class="color-btn" data-color="#ffffff" style="background:#ffffff" title="Blanco"></button>
          <button class="color-btn" data-color="#f1c40f" style="background:#f1c40f" title="Amarillo"></button>
          <button class="color-btn" data-color="#e67e22" style="background:#e67e22" title="Naranja"></button>
          <button class="color-btn" data-color="#9b59b6" style="background:#9b59b6" title="Morado"></button>
          <input type="color" id="color-libre" value="#e74c3c" title="Color libre" />
        </div>
      </div>

      <!-- TEXTO -->
      <div class="campo">
        <label for="texto-input">Mensaje personalizado</label>
        <input type="text" id="texto-input" placeholder="Escribe aquí..." maxlength="60" />
        <span class="char-counter"><span id="char-count">0</span>/60</span>
      </div>

      <!-- FUENTE Y ESTILO -->
      <div class="campo">
        <label for="fuente-select">Fuente</label>
        <select id="fuente-select">
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
        </select>
      </div>

      <div class="campo">
        <label for="estilo-select">Estilo</label>
        <select id="estilo-select">
          <option value="normal">Normal</option>
          <option value="italic">Itálica</option>
          <option value="oblique">Oblicua</option>
        </select>
      </div>

      <div class="divisor"></div>

      <!-- DATOS DEL CLIENTE -->
      <div class="campo">
        <label for="nombre-cliente">Nombre <span class="req">*</span></label>
        <input type="text" id="nombre-cliente" placeholder="Tu nombre completo" />
      </div>

      <div class="campo">
        <label for="email-cliente">Email <span class="req">*</span></label>
        <input type="email" id="email-cliente" placeholder="tu@email.com" />
      </div>

      <!-- ENVÍO -->
      <button id="btn-enviar" type="button">Enviar mi diseño</button>

      <!-- Spinner -->
      <div id="spinner" class="spinner hidden"></div>

      <!-- Feedback -->
      <div id="mensaje-feedback" class="mensaje-feedback hidden"></div>
    </aside>

  </main>

  <!-- Three.js r165 desde CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

    window.THREE = THREE;
    window.THREE_ADDONS = { OrbitControls, GLTFLoader };

    const s = document.createElement('script');
    s.src = 'main.js';
    document.body.appendChild(s);
  </script>

</body>
</html>
